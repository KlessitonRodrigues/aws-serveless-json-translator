swagger: '2.0'
info:
  title: AWS JSON Translator API
  description: Swagger 2.0 specification for the AWS JSON Translator service.
  version: '1.0.0'
host: localhost:3005
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

paths:
  /translate:
    post:
      tags:
        - Translation
      summary: Translate JSON values
      operationId: translateJson
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TranslateRequest'
      responses:
        '200':
          description: JSON translated successfully.
          schema:
            $ref: '#/definitions/TranslateResponse'
        '400':
          description: Invalid translation request.
          schema:
            $ref: '#/definitions/ErrorResponse'

definitions:
  TranslateRequest:
    type: object
    required:
      - json
      - targetLanguage
    properties:
      json:
        type: string
        description: A JSON-encoded object whose values will be translated.
        example: '{"greeting":"Hello"}'
      sourceLanguage:
        type: string
        default: auto
        minLength: 2
        maxLength: 20
        description: Source language code, or auto for automatic detection.
      targetLanguage:
        type: string
        minLength: 2
        maxLength: 20
        description: Target language code.
        example: es
  TranslateResponse:
    type: object
    properties:
      message:
        type: string
        example: Success
      data:
        type: object
        properties:
          translatedJson:
            type: string
            description: A JSON-encoded object containing translated values.
            example: '{"greeting":"Hola"}'
  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        example: Invalid request
      details:
        type: object
